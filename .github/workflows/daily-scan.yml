name: Flashscore Scan (4x daily)

on:
  schedule:
    # UTC pour 09h30 / 12h30 / 15h30 / 18h30 Europe/Paris (ete CEST=UTC+2)
    # En hiver (CET=UTC+1) les scans tombent 1h plus tot : 08h30/11h30/14h30/17h30 Paris
    - cron: '30 7 * * *'    # 09:30 CEST
    - cron: '30 10 * * *'   # 12:30 CEST
    - cron: '30 13 * * *'   # 15:30 CEST
    - cron: '30 16 * * *'   # 18:30 CEST
  workflow_dispatch: {}

concurrency:
  group: flashscore-push
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Flashscore crawler
        run: python flashscore.py --sport all

      - name: Publish output as flashscore_today.json
        run: |
          cp flashscore_previews.json flashscore_today.json 2>/dev/null || echo '[]' > flashscore_today.json
          echo "Scan termine : $(TZ=Europe/Paris date '+%Y-%m-%d %H:%M Paris')"

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Scan $(TZ=Europe/Paris date '+%Y-%m-%d %H:%M Paris')"
          git pull --rebase origin main
          git push origin main
